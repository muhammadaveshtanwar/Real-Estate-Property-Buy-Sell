<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta
      name="description"
      content="Find a place to call yours with Haven, the thoughtful real estate marketplace."
    />
    <title>Haven — Find your place</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <a class="brand" href="#" data-page="home" aria-label="Haven home">
          <span class="brand-mark" aria-hidden="true">h</span>
          <span>haven</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-page="home">Discover</button>
          <button class="nav-link" data-page="reels">Reels</button>
          <button class="nav-link" data-page="messages" data-auth="true">Messages</button>
          <button class="nav-link" data-page="dashboard" data-auth="true">For brokers</button>
        </nav>
        <div class="header-actions">
          <button class="icon-button notification-button" aria-label="Notifications" data-auth="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
            <i></i>
          </button>
          <button class="avatar-button" id="accountButton" aria-label="Sign in">↗</button>
          <button class="mobile-menu-button" id="mobileMenuButton" aria-label="Open menu">
            <span></span><span></span>
          </button>
        </div>
      </header>

      <main id="mainContent"></main>

      <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <button class="mobile-tab active" data-page="home"><span>⌂</span>Explore</button>
        <button class="mobile-tab" data-page="reels"><span>▣</span>Reels</button>
        <button class="mobile-tab" data-page="messages" data-auth="true"><span>◌</span>Inbox</button>
        <button class="mobile-tab" data-page="dashboard" data-auth="true"><span>▤</span>Manage</button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="modal-backdrop" id="modalBackdrop" hidden>
        <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
